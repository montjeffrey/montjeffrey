# Capture-the-flag verifier for the profile README.
#
# Issues are opened by strangers, so this is hardened:
# - Runs only on `issues: opened` carrying the `ctf` label the issue form
#   applies. Issue-event workflows always run from the default branch, so a
#   visitor can never change this file or the scripts it calls.
# - No untrusted value is interpolated into a `run:` script. ctf/check.py reads
#   the issue body from the event payload file and treats it purely as data.
#   Shells only ever see our own outputs, an issue number and the repo name,
#   and only through environment variables.
# - The token has no permissions by default; this one job gets exactly
#   contents: write (hall of fame) and issues: write (reply, close, redact).
# - The only third-party action is pinned to a full commit SHA, not a tag.
# - Runs are serialised so two solvers cannot race on README.md.
name: ctf

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: ctf-hall-of-fame
  cancel-in-progress: false

jobs:
  verify:
    if: contains(github.event.issue.labels.*.name, 'ctf')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the submission
        id: check
        env:
          CTF_FLAG: ${{ secrets.CTF_FLAG }}
        run: python3 ctf/check.py

      - name: Record the solver
        if: steps.check.outputs.added == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "ctf: add a solver to the hall of fame"
          git push

      - name: Reply and close
        if: always() && steps.check.outputs.result != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RESULT: ${{ steps.check.outputs.result }}
          ADDED: ${{ steps.check.outputs.added }}
        run: |
          case "$RESULT" in
            correct)
              if [ "$ADDED" = "true" ]; then msg=ctf/replies/correct.md
              else msg=ctf/replies/already.md; fi ;;
            wrong) msg=ctf/replies/wrong.md ;;
            leaked)
              gh issue edit "$ISSUE" --repo "$REPO" --body-file ctf/replies/redacted.md
              msg=ctf/replies/leaked.md ;;
            *) msg=ctf/replies/invalid.md ;;
          esac
          gh issue comment "$ISSUE" --repo "$REPO" --body-file "$msg"
          gh issue close "$ISSUE" --repo "$REPO"
